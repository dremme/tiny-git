plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.20'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.diffplug.spotless' version '8.8.0'
}

group = 'hamburg.remme'
version = '0.10.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

kotlin {
    jvmToolchain(21)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        freeCompilerArgs.add('-Xjsr305=strict')
    }
}

repositories {
    mavenCentral()
}

spotless {
    encoding 'UTF-8'
    kotlin {
        // Only real sources — never build/ or generated outputs (avoids task-order conflicts)
        target 'src/main/kotlin/**/*.kt', 'src/test/kotlin/**/*.kt'
        ktlint('1.5.0')
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'misc', {
        target '*.gradle', '*.md', '.gitignore', 'gradle.properties'
        trimTrailingWhitespace()
        endWithNewline()
        leadingTabsToSpaces(4)
    }
}

// Enforce formatting as part of the standard check lifecycle
tasks.named('check') {
    dependsOn 'spotlessCheck'
}

javafx {
    version = '21.0.6'
    modules = [
            'javafx.base',
            'javafx.graphics',
            'javafx.controls',
            'javafx.fxml',
            'javafx.web',
            'javafx.media'
    ]
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    implementation "org.jetbrains.kotlin:kotlin-reflect"
    implementation 'org.yaml:snakeyaml:2.3'
    // Mac system menu bar integration (no-op path on Windows/Linux)
    implementation 'de.codecentric.centerdevice:centerdevice-nsmenufx:2.1.6'
}

application {
    mainClass = 'hamburg.remme.tinygit.TinyGitKt'
    applicationDefaultJvmArgs = [
            '-XX:+UseParallelGC',
            // Gray AA for dark UI (LCD subpixel fringing looks soft on dark panels)
            '-Dprism.lcdtext=false',
            '-Dprism.forceIntegerRenderScale=true',
            "--add-opens=javafx.graphics/com.sun.javafx.css=ALL-UNNAMED",
            "--add-opens=javafx.controls/com.sun.javafx.scene.control=ALL-UNNAMED",
            "--add-opens=javafx.controls/com.sun.javafx.scene.control.skin=ALL-UNNAMED",
            "--add-opens=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED"
    ]
}

// Generated CSS lives under build/ (not src/) so Spotless and other source tasks
// do not share an output path with compileSCSS (Gradle 8 implicit-dependency check).
// Layout: build/generated/resources/css/*.css → classpath /css/*.css (same as before).
def scssOutputDir = layout.buildDirectory.dir('generated/resources')
// Committed fallback if Dart Sass / npx is unavailable after a clean build
def scssSeedDir = layout.projectDirectory.dir('scss-seed')

sourceSets {
    main {
        resources {
            // SCSS is compiled to CSS; do not ship raw SCSS sources as resources
            exclude '**/*.scss'
            srcDir scssOutputDir
        }
    }
}

tasks.register('compileSCSS') {
    description = 'Compile platform SCSS stylesheets to CSS for JavaFX'
    group = 'build'
    def winScss = file('src/main/resources/hamburg/remme/tinygit/main-windows.scss')
    def macScss = file('src/main/resources/hamburg/remme/tinygit/main-mac.scss')
    def scssTree = fileTree('src/main/resources/hamburg/remme/tinygit') {
        include '**/*.scss'
    }
    inputs.files(scssTree)
    inputs.dir(scssSeedDir).optional()
    outputs.dir(scssOutputDir)

    doLast {
        def cssDir = scssOutputDir.get().dir('css').asFile
        cssDir.mkdirs()
        compileScssWithDartSass(
                winScss,
                new File(cssDir, 'main-windows.css'),
                scssSeedDir.file('main-windows.css').asFile
        )
        compileScssWithDartSass(
                macScss,
                new File(cssDir, 'main-mac.css'),
                scssSeedDir.file('main-mac.css').asFile
        )
    }
}

static void compileScssWithDartSass(File input, File output, File seed = null) {
    // Prefer local/global sass; fall back to npx. On Windows prefer *.cmd to avoid PowerShell policy issues.
    def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
    def sassCmd = isWindows ? 'sass.cmd' : 'sass'
    def npxCmd = isWindows ? 'npx.cmd' : 'npx'
    def commands = [
            [sassCmd, input.absolutePath, output.absolutePath, '--style=compressed', '--no-charset', '--no-source-map'],
            [npxCmd, '--yes', 'sass', input.absolutePath, output.absolutePath, '--style=compressed', '--no-charset', '--no-source-map']
    ]
    def lastError = null
    for (cmd in commands) {
        try {
            def process = new ProcessBuilder(cmd)
                    .redirectErrorStream(true)
                    .directory(input.parentFile)
                    .start()
            def stdout = process.inputStream.getText('UTF-8')
            def exit = process.waitFor()
            if (exit == 0 && output.exists()) {
                // JavaFX CSS is a subset of CSS: no @charset, no hsl() — convert to integer rgb()
                def css = output.getText('UTF-8')
                css = css.replaceFirst(/(?i)@charset\s+"UTF-8";\s*/, '')
                css = sanitizeCssForJavaFx(css)
                output.write(css, 'UTF-8')
                return
            }
            lastError = "Command ${cmd.join(' ')} exited $exit\n$stdout"
        } catch (Exception e) {
            lastError = e.message
        }
    }
    // Reuse prior build output, then committed seed CSS, so clean builds work without Sass.
    if (output.exists()) {
        println "WARN: Could not recompile ${input.name}; reusing existing ${output.name}. (${lastError ?: 'sass unavailable'})"
        return
    }
    if (seed != null && seed.exists()) {
        seed.withInputStream { inputStream ->
            output.withOutputStream { outputStream -> outputStream << inputStream }
        }
        println "WARN: Could not recompile ${input.name}; copied seed ${seed.name}. (${lastError ?: 'sass unavailable'})"
        return
    }
    throw new GradleException(
            "Failed to compile SCSS ${input.name} and no seed CSS was found. Install Dart Sass (`npm i -g sass`).\n${lastError ?: ''}"
    )
}

tasks.named('processResources') {
    dependsOn('compileSCSS')
}

/**
 * Dart Sass emits modern CSS color functions (hsl / percent rgb) that JavaFX's CssParser rejects.
 * Convert them to classic integer rgb()/rgba() so the existing SCSS design still renders.
 */
static String sanitizeCssForJavaFx(String css) {
    // hsl(h, s%, l%) or hsl(h,s%,l%,a) / hsla(...)
    def hslPattern = ~/(?i)hsla?\(\s*([0-9.]+)\s*,\s*([0-9.]+)%\s*,\s*([0-9.]+)%\s*(?:,\s*([0-9.]+)\s*)?\)/
    css = css.replaceAll(hslPattern) { full, h, s, l, a ->
        def rgb = hslToRgb(h as double, (s as double) / 100.0, (l as double) / 100.0)
        if (a != null) {
            "rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})"
        } else {
            "rgb(${rgb[0]},${rgb[1]},${rgb[2]})"
        }
    }
    // rgb(37.8%, 49.5%, 54.9%) → rgb(r,g,b)
    def pctRgb = ~/(?i)rgba?\(\s*([0-9.]+)%\s*,\s*([0-9.]+)%\s*,\s*([0-9.]+)%\s*(?:,\s*([0-9.]+)\s*)?\)/
    css = css.replaceAll(pctRgb) { full, r, g, b, a ->
        int ri = Math.round((r as double) * 2.55) as int
        int gi = Math.round((g as double) * 2.55) as int
        int bi = Math.round((b as double) * 2.55) as int
        if (a != null) {
            "rgba(${ri},${gi},${bi},${a})"
        } else {
            "rgb(${ri},${gi},${bi})"
        }
    }
    return css
}

/** Standard HSL→RGB conversion; H in degrees, S/L in 0..1. Returns int[3] 0..255. */
static int[] hslToRgb(double h, double s, double l) {
    double c = (1 - Math.abs(2 * l - 1)) * s
    double hp = ((h % 360) + 360) % 360 / 60.0
    double x = c * (1 - Math.abs(hp % 2 - 1))
    double r1 = 0, g1 = 0, b1 = 0
    if (hp < 1) { r1 = c; g1 = x; b1 = 0 }
    else if (hp < 2) { r1 = x; g1 = c; b1 = 0 }
    else if (hp < 3) { r1 = 0; g1 = c; b1 = x }
    else if (hp < 4) { r1 = 0; g1 = x; b1 = c }
    else if (hp < 5) { r1 = x; g1 = 0; b1 = c }
    else { r1 = c; g1 = 0; b1 = x }
    double m = l - c / 2
    return [
            Math.round((r1 + m) * 255) as int,
            Math.round((g1 + m) * 255) as int,
            Math.round((b1 + m) * 255) as int
    ] as int[]
}

// Fat classpath JAR of project classes + non-JavaFX deps (JavaFX stays modular via the plugin / run scripts)
tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Runnable JAR with app + non-JavaFX dependencies (use run scripts for JavaFX module-path)'
    archiveBaseName = 'tiny-git'
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Main-Class': application.mainClass.get(),
                'Implementation-Title': 'TinyGit',
                'Implementation-Version': project.version
        )
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath
                .findAll { it.name && !it.name.startsWith('javafx-') }
                .collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.named('assemble') {
    dependsOn fatJar
}

// Helper: print a Windows-friendly java command using resolved JavaFX jars
tasks.register('printRunCommand') {
    group = 'help'
    description = 'Print a java command line that launches TinyGit with JavaFX modules'
    doLast {
        def fxJars = configurations.runtimeClasspath.files.findAll { it.name.startsWith('javafx-') }
        def modulePath = fxJars.collect { it.absolutePath }.join(File.pathSeparator)
        def appJar = tasks.fatJar.archiveFile.get().asFile.absolutePath
        println "java -XX:+UseParallelGC --module-path \"$modulePath\" --add-modules javafx.controls,javafx.web,javafx.media,javafx.fxml -jar \"$appJar\""
    }
}
